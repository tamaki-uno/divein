<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIVEIN</title>
    <!-- <link rel="stylesheet" href="style.css"> -->

    <!-- <script>setTimeout(() => location.reload(), 1000 * 10);</script> -->
    <!-- <link rel="stylesheet" id="theme" href="./themes/light.css"> -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body id="body" class="light">
    <img
      src="./icons/loading.svg"
      alt="Loading..."
      id="loading"
      onclick="location.reload()"
      style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100px;
        height: 100px;
        z-index: 1000;
      "
    />
    <img src="./icons/home.svg" alt="Home" id="home" class="control" style="right: 1em;"/>
    <img src="./icons/setting.svg" alt="Settings" id="settings" class="control" style="right: 4em;" />
    <img src="./icons/sync.svg" alt="Sync" id="sync" class="control" style="right: 7em;" />
    <img src="./icons/download.svg" alt="Download" id="download" class="control" style="right: 10em;" />
    <img src="./icons/upload.svg" alt="Upload" id="upload" class="control" style="right: 13em;" />
    <!-- for debugging purposes -->
    <img src="./icons/reload.svg" alt="reload" id="reload" class="control" style="right: 16em;" />
    <main id="main"></main>
    <script src="idb.js"></script>
    <script src="app.js"></script>
  </body>
</html>
