<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="contaier" id="container">
        <!-- <div class="content 1">Content-1</div>
        <div class="content 2">Content-2</div> -->
    </div>
        <input type="text" id="content-name" />
        <button id="add-button">Add Content</button>
        <button id="remove-all-button">Remove All Content</button>
        <br>
        <button id="update-button">Update Content</button>
    <script>
        // const container = document.querySelector('.container');
        
        // const a = [1, 2, 3];
        // a.forEach(item => {
        //     const div = initContent(item) || document.createElement('div');
        //     container.appendChild(div);
        // });
        function createContent(a) {
            const div = document.createElement('div');
            div.className = 'content ' + a;
            // div.textContent = 'Content-' + a + '()';
            // div.textContent = `<Content-${a}> (class: '${div.className}')`;
            const span = document.createElement('span');
            span.textContent = `Content-${a} (class: '${div.className}')`;
            div.appendChild(span);
            // div.addEventListener('click', () => {
            //     console.log('Clicked on:', div);
            //     // location.reload();
            //     const contentNames = JSON.parse(localStorage.getItem('content'));
            //     contentNames.splice(contentNames.indexOf(a), 1); // Remove the clicked content name
            //     localStorage.setItem('content', JSON.stringify(contentNames));
            //     console.log(a, 'removed from localStorage');
            //     console.log('Current content names:', contentNames);
            //     updateContent(); // Update the displayed content
            // });
            const button = document.createElement('button');
            button.textContent = 'Remove';
            button.addEventListener('click', () => {
                const contentNames = JSON.parse(localStorage.getItem('content'));
                contentNames.splice(contentNames.indexOf(a), 1);
                localStorage.setItem('content', JSON.stringify(contentNames));
                console.log(a, 'removed from localStorage');
                console.log('Current content names:', contentNames);
                updateContent();
            });
            div.appendChild(button);
            div.append(document.createElement('br'));
            for (let i = 0; i < 100; i++) {
                const span = document.createElement('span');
                span.textContent = i;
                div.appendChild(span);
            }
            return div;
        }

        function addContent(name) {
            // const div = document.querySelector('.content.' + CSS.escape(name)) || createContent(name);
            // container.appendChild(div);
            // Save to localStorage
            const contentNames = JSON.parse(localStorage.getItem('content')) || [];
            contentNames.push(name);
            localStorage.setItem('content', JSON.stringify(contentNames));
            console.log('Content names after adding:', contentNames);
            updateContent();
            // container.appendChild(document.getElementById('content-name'));
            // container.appendChild(document.getElementById('add-button'));
            // container.appendChild(document.getElementById('update-button'));
        }

        function appendButtons() {
            container.appendChild(document.getElementById('content-name'));
            container.appendChild(document.getElementById('add-button'));
            container.appendChild(document.getElementById('update-button'));
        }

        function updateContent() {
            const contentNames = JSON.parse(localStorage.getItem('content'));
            container.innerHTML = ''; // Clear the container
            contentNames.forEach(name => {
                // const div = createContent(name);
                // container.appendChild(addContent(name));
                // const div = document.querySelector('.content.' + CSS.escape(name)) || createContent(name);
                const div = createContent(name);
                container.appendChild(div);
                // appendButtons();
            });
            // appendButtons();
            // document.getElementById('content-name').focus(); // Refocus on input field
        }
        // let counter = 2;
        // const defaultContentNames = ['1', '2'];
        // const defaultContentNames = JSON.parse(localStorage.getItem('content')) || [];
        // localStorage.setItem('content', JSON.stringify(['1', '2']));
        // const defaultContentNames = JSON.parse(localStorage.getItem('content'));
        document.addEventListener('DOMContentLoaded', () => {
            // defaultContentNames.forEach(name => addContent(name));
            // defaultContentNames.forEach(name => {
            //     const div = createContent(name);
            //     container.appendChild(div);
            // });
            // document.getElementById('content-name').focus(); // Focus on input field
            updateContent();
        });

        document.getElementById('content-name').addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent form submission
                document.getElementById('add-button').click(); // Trigger button click
                document.getElementById('content-name').focus(); // Refocus on input field
            }
        });
        document.getElementById('add-button').addEventListener('click', () => {
            // const contentNumber = document.getElementById('content-number').value;
            // console.log('Adding content number:', contentNumber);
            // const div = document.querySelector('.content.' + contentNumber) || document.createElement('div');
            const contentName = document.getElementById('content-name').value;
            console.log('Adding content name:', contentName);
            addContent(contentName);
            // const contentCssName = CSS.escape(contentName);
            // const div = document.querySelector('.content.' + contentCssName) || createContent(contentName);
            // console.log('Adding content name:', contentName, 'with CSS class:', contentCssName, 'and div:', div);
            // container.appendChild(div);
            document.getElementById('content-name').value = ''; // Clear input field
            document.getElementById('content-name').focus(); // Refocus on input field
        });
        document.getElementById('remove-all-button').addEventListener('click', () => {
            localStorage.removeItem('content'); // Clear localStorage
            // container.innerHTML = ''; // Clear the container
            updateContent();
            console.log('All content removed from localStorage');
            document.getElementById('content-name').focus(); // Refocus on input field
        });
        document.getElementById('update-button').addEventListener('click', () => {
            // const contentNames = JSON.parse(localStorage.getItem('content')) || [];
            // // container.innerHTML = ''; // Clear the container
            // // contentNames.forEach(name => addContent(name)); // Re-add all contents
            // contentNames.forEach(name => {
            //     // const div = createContent(name);
            //     container.appendChild(addContent(name));
            //     appendButtons();
            // });
            // document.getElementById('content-name').focus(); // Refocus on input field
            updateContent();
        });
    </script>
</body>
</html>
