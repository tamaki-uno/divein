<!-- ポップアップUI: ログイン・新規登録・ログアウト -->
<div class="popup large-border-radius">
    <img src="/icon/close-button.svg" alt="Close" class="close-popup-icon small-border-radius background-on-hover" tabindex="0">

    <!-- ログインフォーム -->
    <form class="login-form" action="/api/v0/login" method="post">
        <h2><img src="/icon/closed.svg" alt="">Dive back in!</h2>
        <label for="login-username">ユーザー名</label>
        <input type="text" id="login-username" name="username" required autocomplete="username" class="small-border-radius" pattern="^[a-zA-Z0-9_]{4,16}$">
        <label for="login-password">パスワード</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password" class="small-border-radius" pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$">
        <button type="submit" class="login-button small-border-radius accent-background-color">ログイン</button>
        <p class="register-link">アカウントをお持ちでないですか？<br>
            <a href="/signup">登録はこちら</a>
        </p>
    </form>

    <!-- 新規登録フォーム -->
    <form class="signup-form" action="/api/v0/signup" method="post">
        <h2><img src="/icon/closed.svg" alt="">Dive In!</h2>
        <label for="signup-username">ユーザー名</label>
        <input type="text" id="signup-username" name="username" required autocomplete="username" class="small-border-radius" pattern="^[a-zA-Z0-9_]{4,16}$">
        <label for="signup-email">メールアドレス</label>
        <input type="email" id="signup-email" name="email" required autocomplete="email" class="small-border-radius">
        <label for="signup-password">パスワード</label>
        <input type="password" id="signup-password" name="password" required autocomplete="new-password" class="small-border-radius" pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$">
        <label for="signup-confirm-password">パスワード確認</label>
        <input type="password" id="signup-confirm-password" name="confirm-password" required autocomplete="new-password" class="small-border-radius" pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$">
        <p class="terms">
            登録をクリックすることで、<a href="/terms">利用規約</a>と<a href="/privacy">プライバシーポリシー</a>に同意したとみなされます。
        </p>
        <button type="submit" class="login-button small-border-radius accent-background-color">登録</button>
        <p class="login-link">既にアカウントをお持ちですか？<br>
            <a href="/login">ログインはこちら</a>
        </p>
    </form>

    <!-- ログアウトフォーム -->
    <form class="logout-form">
        <h2>ログアウト</h2>
        <button type="submit" class="logout-button small-border-radius accent-background-color">ログアウト</button>
    </form>
</div>
