<div class="popup large-border-radius">
    <button type="button" class="close-popup-button">
        <img src="/icon/close-button.svg" alt="Close" class="close-popup-icon">
    </button>
    <!--  ログインフォーム -->
    <form class="login-form">
        <h2>Dive back in!</h2>
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username" required autocomplete="username" class="small-border-radius">

        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
            class="small-border-radius">

        <button type="submit" class="login-button small-border-radius">ログイン</button>

        <p class="register-link">アカウントをお持ちでないですか？<br>
            <a href="/signup" >登録はこちら</a>
        </p>
    </form>
    <!--  登録フォーム -->
    <form class="signup-form" action="/signup" method="post">
        <h2>Dive In!</h2>
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username" required autocomplete="username" class="small-border-radius">

        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required autocomplete="email" class="small-border-radius">

        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required autocomplete="new-password"
            class="small-border-radius">

        <label for="confirm-password">パスワード確認</label>
        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password"
            class="small-border-radius">

        <p class="terms">
            登録をクリックすることで、<a href="/terms">利用規約</a>と<a href="/privacy">プライバシーポリシー</a>に同意したとみなされます。
        </p>

        <button type="submit" class="login-button small-border-radius">登録</button>

        <p class="login-link">既にアカウントをお持ちですか？<br>
            <a href="/login">ログインはこちら</a>
        </p>
    </form>
    <!--  ログアウトフォーム -->
    <form class="logout-form" action="/logout" method="post">
        <h2>ログアウト</h2>
        <button type="submit" class="logout-button small-border-radius">ログアウト</button>
    </form>
</div>
